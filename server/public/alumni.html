<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Alumni Tracker — Mezun listesi ve yönetim paneli. Mezunları görüntüle, ara ve yeni mezun ekle.">
  <title>Mezunlar | Alumni Tracker</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    /* ==================== Alumni Page Styles ==================== */
    .alumni-page {
      min-height: 100vh;
      background: var(--bg-main);
      padding-top: 100px;
    }

    /* Header Section */
    .alumni-header {
      text-align: center;
      margin-bottom: 48px;
    }

    .alumni-header .page-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, var(--gold-400), var(--gold-500));
      color: var(--navy-900);
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 16px;
    }

    .alumni-header h1 {
      font-family: 'Source Serif 4', serif;
      font-size: 2.5rem;
      color: var(--navy-900);
      margin-bottom: 8px;
    }

    .alumni-header p {
      color: var(--text-light);
      font-size: 1.05rem;
    }

    /* Stats Bar */
    .stats-bar {
      display: flex;
      justify-content: center;
      gap: 32px;
      margin-bottom: 40px;
      flex-wrap: wrap;
    }

    .stat-item {
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: 16px;
      padding: 20px 32px;
      text-align: center;
      box-shadow: var(--shadow-sm);
      min-width: 160px;
      transition: transform var(--transition), box-shadow var(--transition);
    }

    .stat-item:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    .stat-number {
      font-family: 'Source Serif 4', serif;
      font-size: 2rem;
      font-weight: 700;
      color: var(--navy-800);
      line-height: 1;
    }

    .stat-label {
      font-size: 0.82rem;
      color: var(--text-light);
      margin-top: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Controls Bar */
    .controls-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 32px;
      flex-wrap: wrap;
    }

    .search-box {
      position: relative;
      flex: 1;
      max-width: 420px;
    }

    .search-box input {
      width: 100%;
      padding: 12px 16px 12px 44px;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      font-size: 0.95rem;
      font-family: inherit;
      background: var(--bg-card);
      color: var(--text-dark);
      transition: border-color var(--transition), box-shadow var(--transition);
    }

    .search-box input:focus {
      outline: none;
      border-color: var(--gold-400);
      box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.15);
    }

    .search-box .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1.1rem;
      opacity: 0.4;
    }

    .filter-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .filter-select {
      padding: 10px 14px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: 0.9rem;
      font-family: inherit;
      background: var(--bg-card);
      color: var(--text-mid);
      cursor: pointer;
      transition: border-color var(--transition);
    }

    .filter-select:focus {
      outline: none;
      border-color: var(--gold-400);
    }

    .btn-add {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 24px;
      background: linear-gradient(135deg, var(--navy-800), var(--navy-600));
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: transform var(--transition), box-shadow var(--transition);
    }

    .btn-add:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 16px rgba(10, 22, 40, 0.3);
    }

    /* Alumni Grid */
    .alumni-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 24px;
      margin-bottom: 60px;
    }

    /* Alumni Card */
    .alumni-card {
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: 16px;
      padding: 28px;
      box-shadow: var(--shadow-sm);
      transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
      position: relative;
      overflow: hidden;
      animation: cardFadeIn 0.4s ease both;
    }

    .alumni-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--gold-400), var(--gold-500), var(--navy-500));
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .alumni-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-lg);
      border-color: var(--gold-300);
    }

    .alumni-card:hover::before {
      opacity: 1;
    }

    @keyframes cardFadeIn {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card-top {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
    }

    .avatar {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      font-weight: 700;
      color: #fff;
      flex-shrink: 0;
      background: linear-gradient(135deg, var(--navy-700), var(--navy-500));
    }

    .avatar.gold {
      background: linear-gradient(135deg, var(--gold-500), var(--gold-400));
      color: var(--navy-900);
    }

    .card-identity h3 {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--navy-900);
      line-height: 1.3;
    }

    .card-identity .card-role {
      font-size: 0.85rem;
      color: var(--gold-600);
      font-weight: 500;
    }

    .card-details {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .detail-row {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.9rem;
      color: var(--text-mid);
    }

    .detail-row .detail-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: var(--bg-main);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      flex-shrink: 0;
    }

    .detail-row strong {
      color: var(--text-dark);
      font-weight: 500;
    }

    .card-tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-top: 16px;
      padding: 5px 12px;
      border-radius: 8px;
      font-size: 0.78rem;
      font-weight: 600;
      background: rgba(212, 175, 55, 0.1);
      color: var(--gold-600);
      border: 1px solid rgba(212, 175, 55, 0.2);
    }

    /* No Results */
    .no-results {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: var(--text-light);
    }

    .no-results .no-icon {
      font-size: 3rem;
      margin-bottom: 16px;
      opacity: 0.4;
    }

    .no-results h3 {
      font-size: 1.2rem;
      color: var(--text-mid);
      margin-bottom: 8px;
    }

    /* Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(10, 22, 40, 0.6);
      backdrop-filter: blur(4px);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal-overlay.active {
      display: flex;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .modal {
      background: var(--bg-card);
      border-radius: 20px;
      padding: 36px;
      width: 100%;
      max-width: 520px;
      box-shadow: 0 24px 60px rgba(0,0,0,0.2);
      animation: slideUp 0.3s ease;
    }

    @keyframes slideUp {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
    }

    .modal-header h2 {
      font-family: 'Source Serif 4', serif;
      font-size: 1.4rem;
      color: var(--navy-900);
    }

    .modal-close {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      border: 1px solid var(--border-light);
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      color: var(--text-light);
      transition: all var(--transition);
    }

    .modal-close:hover {
      background: #fee2e2;
      color: #dc2626;
      border-color: #fecaca;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-mid);
      margin-bottom: 6px;
    }

    .form-group label .required {
      color: #dc2626;
    }

    .form-group input {
      width: 100%;
      padding: 11px 14px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: 0.92rem;
      font-family: inherit;
      color: var(--text-dark);
      background: var(--bg-main);
      transition: border-color var(--transition), box-shadow var(--transition);
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--gold-400);
      box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.12);
      background: #fff;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .btn-submit {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, var(--gold-500), var(--gold-400));
      color: var(--navy-900);
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      margin-top: 8px;
      transition: transform var(--transition), box-shadow var(--transition);
    }

    .btn-submit:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 16px rgba(212, 175, 55, 0.3);
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 30px;
      right: 30px;
      padding: 14px 24px;
      border-radius: 12px;
      color: #fff;
      font-weight: 600;
      font-size: 0.9rem;
      z-index: 2000;
      transform: translateY(80px);
      opacity: 0;
      transition: all 0.3s ease;
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    .toast.success { background: linear-gradient(135deg, #059669, #10b981); }
    .toast.error { background: linear-gradient(135deg, #dc2626, #ef4444); }

    /* Loading Skeleton */
    .skeleton-card {
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: 16px;
      padding: 28px;
      animation: shimmer 1.5s infinite;
    }

    .skeleton-line {
      height: 14px;
      background: linear-gradient(90deg, #e5e1d8 25%, #f2f0eb 50%, #e5e1d8 75%);
      background-size: 200% 100%;
      border-radius: 6px;
      margin-bottom: 12px;
      animation: shimmer 1.5s infinite;
    }

    .skeleton-line.w60 { width: 60%; }
    .skeleton-line.w80 { width: 80%; }
    .skeleton-line.w40 { width: 40%; }

    .skeleton-avatar {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      background: linear-gradient(90deg, #e5e1d8 25%, #f2f0eb 50%, #e5e1d8 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
    }

    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* Responsive */
    @media (max-width: 768px) {
      .alumni-header h1 { font-size: 1.8rem; }
      .stats-bar { gap: 16px; }
      .stat-item { padding: 16px 20px; min-width: 120px; }
      .controls-bar { flex-direction: column; align-items: stretch; }
      .search-box { max-width: 100%; }
      .alumni-grid { grid-template-columns: 1fr; }
      .form-row { grid-template-columns: 1fr; }
      .modal { padding: 24px; }
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar" id="navbar">
    <div class="container">
      <a href="/" class="navbar-brand">
        <div class="logo-icon">🎓</div>
        <span>Alumni<span class="brand-accent">Tracker</span></span>
      </a>
      <ul class="nav-links" id="navLinks">
        <li><a href="/">Home</a></li>
        <li><a href="/announcements">Announcements</a></li>
        <li><a href="/users" class="active">Alumni Directory</a></li>
        <li><a href="/about">About</a></li>
        <li><a href="/api/swagger" target="_blank" class="nav-cta">Swagger API</a></li>
      </ul>
      <button class="mobile-toggle" id="mobileToggle" aria-label="Menü">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>

  <main class="alumni-page">
    <div class="container">

      <!-- Header -->
      <div class="alumni-header">
        <div class="page-badge">👥 Mezun Yönetimi</div>
        <h1>Mezunlarımız</h1>
        <p>Üniversitemizden mezun olan tüm değerli üyelerimiz</p>
      </div>

      <!-- Stats -->
      <div class="stats-bar" id="statsBar">
        <div class="stat-item">
          <div class="stat-number" id="statTotal">-</div>
          <div class="stat-label">Toplam Mezun</div>
        </div>
        <div class="stat-item">
          <div class="stat-number" id="statDept">-</div>
          <div class="stat-label">Bölüm</div>
        </div>
        <div class="stat-item">
          <div class="stat-number" id="statCompany">-</div>
          <div class="stat-label">Şirket</div>
        </div>
        <div class="stat-item">
          <div class="stat-number" id="statLatest">-</div>
          <div class="stat-label">Son Mezuniyet</div>
        </div>
      </div>

      <!-- Controls -->
      <div class="controls-bar">
        <div class="search-box">
          <span class="search-icon">🔍</span>
          <input type="text" id="searchInput" placeholder="İsim, email veya şirket ara...">
        </div>
        <div class="filter-group">
          <select class="filter-select" id="filterDept">
            <option value="">Tüm Bölümler</option>
          </select>
          <select class="filter-select" id="filterYear">
            <option value="">Tüm Yıllar</option>
          </select>
        </div>
        <button class="btn-add" id="btnAdd" onclick="openModal()">
          <span>＋</span> Yeni Mezun Ekle
        </button>
      </div>

      <!-- Alumni Grid -->
      <div class="alumni-grid" id="alumniGrid">
        <!-- Loading skeletons -->
        <div class="skeleton-card">
          <div style="display:flex;gap:16px;align-items:center;margin-bottom:20px">
            <div class="skeleton-avatar"></div>
            <div style="flex:1"><div class="skeleton-line w60"></div><div class="skeleton-line w40"></div></div>
          </div>
          <div class="skeleton-line w80"></div>
          <div class="skeleton-line w60"></div>
          <div class="skeleton-line w80"></div>
        </div>
        <div class="skeleton-card">
          <div style="display:flex;gap:16px;align-items:center;margin-bottom:20px">
            <div class="skeleton-avatar"></div>
            <div style="flex:1"><div class="skeleton-line w60"></div><div class="skeleton-line w40"></div></div>
          </div>
          <div class="skeleton-line w80"></div>
          <div class="skeleton-line w60"></div>
          <div class="skeleton-line w80"></div>
        </div>
        <div class="skeleton-card">
          <div style="display:flex;gap:16px;align-items:center;margin-bottom:20px">
            <div class="skeleton-avatar"></div>
            <div style="flex:1"><div class="skeleton-line w60"></div><div class="skeleton-line w40"></div></div>
          </div>
          <div class="skeleton-line w80"></div>
          <div class="skeleton-line w60"></div>
          <div class="skeleton-line w80"></div>
        </div>
      </div>

    </div>
  </main>

  <!-- Add Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <div class="modal-header">
        <h2>🎓 Yeni Mezun Ekle</h2>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
      <form id="addForm" onsubmit="handleSubmit(event)">
        <div class="form-row">
          <div class="form-group">
            <label>Ad Soyad <span class="required">*</span></label>
            <input type="text" name="name" id="inputName" required placeholder="Örn: Ali Vural">
          </div>
          <div class="form-group">
            <label>Email <span class="required">*</span></label>
            <input type="email" name="email" id="inputEmail" required placeholder="ali@alumni.edu">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Mezuniyet Yılı</label>
            <input type="number" name="graduationYear" id="inputYear" placeholder="2024" min="1990" max="2030">
          </div>
          <div class="form-group">
            <label>Bölüm</label>
            <input type="text" name="department" id="inputDept" placeholder="Bilgisayar Müh.">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Şirket</label>
            <input type="text" name="company" id="inputCompany" placeholder="Google">
          </div>
          <div class="form-group">
            <label>Pozisyon</label>
            <input type="text" name="role" id="inputRole" placeholder="Software Engineer">
          </div>
        </div>
        <button type="submit" class="btn-submit" id="btnSubmit">Mezun Ekle</button>
      </form>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script>
    // State
    let allUsers = [];

    // DOM
    const grid = document.getElementById('alumniGrid');
    const searchInput = document.getElementById('searchInput');
    const filterDept = document.getElementById('filterDept');
    const filterYear = document.getElementById('filterYear');
    const modalOverlay = document.getElementById('modalOverlay');
    const addForm = document.getElementById('addForm');

    // Color palette for avatars
    const avatarColors = [
      'linear-gradient(135deg, #1A3050, #2C5A8C)',
      'linear-gradient(135deg, #A58520, #D4AF37)',
      'linear-gradient(135deg, #059669, #10b981)',
      'linear-gradient(135deg, #7c3aed, #a78bfa)',
      'linear-gradient(135deg, #dc2626, #f87171)',
      'linear-gradient(135deg, #0891b2, #22d3ee)',
    ];

    // Fetch users from API
    async function fetchUsers() {
      try {
        const res = await fetch('/api/users');
        const data = await res.json();
        if (data.success) {
          allUsers = data.data;
          updateStats();
          populateFilters();
          renderCards(allUsers);
        }
      } catch (err) {
        grid.innerHTML = `
          <div class="no-results">
            <div class="no-icon">⚠️</div>
            <h3>Bağlantı hatası</h3>
            <p>Sunucuya ulaşılamıyor. Lütfen tekrar deneyin.</p>
          </div>`;
      }
    }

    // Stats
    function updateStats() {
      document.getElementById('statTotal').textContent = allUsers.length;
      const depts = new Set(allUsers.map(u => u.department).filter(Boolean));
      document.getElementById('statDept').textContent = depts.size;
      const companies = new Set(allUsers.map(u => u.company).filter(Boolean));
      document.getElementById('statCompany').textContent = companies.size;
      const years = allUsers.map(u => u.graduationYear).filter(Boolean);
      document.getElementById('statLatest').textContent = years.length ? Math.max(...years) : '-';
    }

    // Populate filter dropdowns
    function populateFilters() {
      const depts = [...new Set(allUsers.map(u => u.department).filter(Boolean))].sort();
      filterDept.innerHTML = '<option value="">Tüm Bölümler</option>' +
        depts.map(d => `<option value="${d}">${d}</option>`).join('');

      const years = [...new Set(allUsers.map(u => u.graduationYear).filter(Boolean))].sort((a, b) => b - a);
      filterYear.innerHTML = '<option value="">Tüm Yıllar</option>' +
        years.map(y => `<option value="${y}">${y}</option>`).join('');
    }

    // Get initials
    function getInitials(name) {
      return name.split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2);
    }

    // Render cards
    function renderCards(users) {
      if (users.length === 0) {
        grid.innerHTML = `
          <div class="no-results">
            <div class="no-icon">🔍</div>
            <h3>Sonuç bulunamadı</h3>
            <p>Arama kriterlerinize uygun mezun bulunamadı.</p>
          </div>`;
        return;
      }

      grid.innerHTML = users.map((user, i) => `
        <div class="alumni-card" style="animation-delay: ${i * 0.06}s">
          <div class="card-top">
            <div class="avatar" style="background: ${avatarColors[i % avatarColors.length]}${avatarColors[i % avatarColors.length].includes('A58520') ? '; color: #0A1628' : ''}">
              ${getInitials(user.name)}
            </div>
            <div class="card-identity">
              <h3>${user.name}</h3>
              <div class="card-role">${user.role || 'Pozisyon belirtilmemiş'}</div>
            </div>
          </div>
          <div class="card-details">
            <div class="detail-row">
              <div class="detail-icon">📧</div>
              <span>${user.email}</span>
            </div>
            <div class="detail-row">
              <div class="detail-icon">🏢</div>
              <strong>${user.company || 'Belirtilmemiş'}</strong>
            </div>
            <div class="detail-row">
              <div class="detail-icon">🎓</div>
              <span>${user.department || 'Belirtilmemiş'}</span>
            </div>
          </div>
          ${user.graduationYear ? `<div class="card-tag">📅 Mezun: ${user.graduationYear}</div>` : ''}
        </div>
      `).join('');
    }

    // Filter logic
    function applyFilters() {
      const query = searchInput.value.toLowerCase().trim();
      const dept = filterDept.value;
      const year = filterYear.value;

      let filtered = allUsers;

      if (query) {
        filtered = filtered.filter(u =>
          u.name.toLowerCase().includes(query) ||
          u.email.toLowerCase().includes(query) ||
          (u.company && u.company.toLowerCase().includes(query)) ||
          (u.role && u.role.toLowerCase().includes(query))
        );
      }

      if (dept) {
        filtered = filtered.filter(u => u.department === dept);
      }

      if (year) {
        filtered = filtered.filter(u => u.graduationYear == year);
      }

      renderCards(filtered);
    }

    searchInput.addEventListener('input', applyFilters);
    filterDept.addEventListener('change', applyFilters);
    filterYear.addEventListener('change', applyFilters);

    // Modal
    function openModal() {
      modalOverlay.classList.add('active');
      document.getElementById('inputName').focus();
    }

    function closeModal() {
      modalOverlay.classList.remove('active');
      addForm.reset();
    }

    modalOverlay.addEventListener('click', (e) => {
      if (e.target === modalOverlay) closeModal();
    });

    // Submit new user
    async function handleSubmit(e) {
      e.preventDefault();
      const btn = document.getElementById('btnSubmit');
      btn.disabled = true;
      btn.textContent = 'Ekleniyor...';

      const payload = {
        name: document.getElementById('inputName').value.trim(),
        email: document.getElementById('inputEmail').value.trim(),
        graduationYear: document.getElementById('inputYear').value ? Number(document.getElementById('inputYear').value) : null,
        department: document.getElementById('inputDept').value.trim() || null,
        company: document.getElementById('inputCompany').value.trim() || null,
        role: document.getElementById('inputRole').value.trim() || null
      };

      try {
        const res = await fetch('/api/users', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();

        if (data.success) {
          showToast('✅ ' + data.message, 'success');
          closeModal();
          fetchUsers();
        } else {
          showToast('❌ ' + data.error, 'error');
        }
      } catch (err) {
        showToast('❌ Sunucu hatası', 'error');
      }

      btn.disabled = false;
      btn.textContent = 'Mezun Ekle';
    }

    // Toast notification
    function showToast(message, type) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.className = `toast ${type} show`;
      setTimeout(() => toast.classList.remove('show'), 3000);
    }

    // Mobile toggle
    document.getElementById('mobileToggle')?.addEventListener('click', () => {
      document.getElementById('navLinks')?.classList.toggle('active');
    });

    // Navbar scroll
    window.addEventListener('scroll', () => {
      document.getElementById('navbar')?.classList.toggle('scrolled', window.scrollY > 30);
    });

    // Init
    fetchUsers();
  </script>

</body>
</html>
